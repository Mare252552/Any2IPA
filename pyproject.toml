[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "any2ipa"
version = "1.0.0"
description = "Portable, defensive IPA inspection, extraction, repacking and zsign integration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Any2IPA contributors"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
]

[project.scripts]
any2ipa = "any2ipa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
